services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: geofence
      POSTGRES_USER: geofence
      POSTGRES_PASSWORD: geofence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofence -d geofence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
